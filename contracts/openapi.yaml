openapi: 3.1.0
info:
  title: Open Education — Reference Learning Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /learners:
    post:
      operationId: create-learner
      summary: "Learner registry; the institutional identifier is masked at enrolment."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /progress:
    post:
      operationId: create-progress
      summary: "Remaining-credits accounts per learner and the credit awards against them."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /assessment-rules:
    post:
      operationId: create-assessment
      summary: "Decision rules binding study levels to attempt limits and integrity envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /courses:
    post:
      operationId: create-course
      summary: "Course catalogue with credit values and modalities."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
